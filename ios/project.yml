name: Rizzr
options:
  bundleIdPrefix: com.rizzr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Rizzr:
    type: application
    platform: iOS
    sources:
      - path: RizzrApp
        excludes:
          - Resources
    resources:
      - path: RizzrApp/Resources
    settings:
      configFiles:
        Debug: Config/Production.xcconfig
        Release: Config/Production.xcconfig
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rizzr.app
        RIZZR_API_BASE_URL: $(RIZZR_API_BASE_URL)
        INFOPLIST_FILE: RizzrApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    postCompileScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed; run brew install swiftlint"
          fi
  RizzrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RizzrTests
    dependencies:
      - target: Rizzr
