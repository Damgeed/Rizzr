disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
line_length:
  warning: 120
  error: 160
type_body_length:
  warning: 300
  error: 450
file_length:
  warning: 500
  error: 800
identifier_name:
  min_length:
    warning: 2
excluded:
  - RizzrApp/Resources
